name: Sync Upstream

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/anthropics/claude-plugins-official.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream/main
        run: git merge upstream/main --no-edit

      - name: Push changes
        run: git push origin main
